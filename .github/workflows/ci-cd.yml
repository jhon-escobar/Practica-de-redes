name: CI/CD Pipeline
on:
 push:
 branches: [main]
jobs:
 build:
 runs-on: ubuntu-latest
 steps:
 - name: Checkout códigos
 uses: actions/checkout@v4
 - name: Configurar Node.js
 uses: actions/setup-node@v4
 with:
 node-version: '20'
 - name: Instalar dependencias
 run: npm install
 - name: Ejecutar pruebas
 run: npm test
 
 
name: CI/CD Pipeline
on:
 push:
 branches: [main]
permissions:
 contents: read
 pages: write
 id-token: write
jobs:
 build:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-node@v4
 with:
 node-version: '20'
 - run: npm install
 - run: npm test
 - name: Subir artefacto
 uses: actions/upload-pages-artifact@v3
 with:
 path: .
 deploy:
 needs: build
 runs-on: ubuntu-latest
 environment:
 name: github-pages
 url: ${{ steps.deployment.outputs.page_url }}
 steps:
 - name: Desplegar a GitHub Pages
 id: deployment
 uses: actions/deploy-pages@v4

